<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🌍 تعلم اللغات</div>
        </div>
    </nav>

    <div class="form-container">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">دخول</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">ليس لديك حساب؟ <a href="register.html" style="color:var(--primary);">اشترك الآن</a></p>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                alert('يرجى ملء جميع الحقول');
                return;
            }
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if(res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('تم الدخول بنجاح!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('خطأ: ' + (data.message || 'فشل الدخول'));
                }
            } catch(err) {
                console.error('Login error:', err);
                alert('خطأ في الاتصال بالخادم. تأكد من أن الخادم يعمل على http://localhost:5000');
            }
        });
    </script>
</body>
</html>
