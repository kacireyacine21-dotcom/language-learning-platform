<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🌍 تعلم اللغات</div>
        </div>
    </nav>

    <div class="form-container">
        <h2>إنشاء حساب جديد</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>الاسم</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">إنشاء الحساب</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">هل لديك حساب؟ <a href="login.html" style="color:var(--primary);">دخول</a></p>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if(!name) {
                alert('يرجى إدخال الاسم');
                return;
            }
            if(!email) {
                alert('يرجى إدخال البريد الإلكتروني');
                return;
            }
            if(!password) {
                alert('يرجى إدخال كلمة المرور');
                return;
            }
            if(password !== confirmPassword) {
                alert('كلمات المرور غير متطابقة');
                return;
            }
            if(password.length < 6) {
                alert('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return;
            }
            
            try {
                const res = await fetch(API_BASE_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await res.json();
                
                if(res.ok && data.success) {
                    alert('تم إنشاء الحساب بنجاح! يرجى تسجيل الدخول');
                    window.location.href = 'login.html';
                } else {
                    alert('خطأ: ' + (data.message || 'حدث خطأ في التسجيل'));
                }
            } catch(err) {
                console.error('Register error:', err);
                alert('خطأ في الاتصال بالخادم. تأكد من أن الخادم يعمل');
            }
        });
    </script>
</body>
</html>
